{% set name = "kvh" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/kvh-{{ version }}.tar.gz
  sha256: f9924df4fb05e72f9d1052f47666ef0a41c46c12eaf530aa685f0e942a3e5247

build:
  #script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation -Csetup-args="$MESON_ARGS"
  number: 0
  #skip: true  # [not (osx and arm64 and py == 312)]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - pip                                 # [build_platform != target_platform]
    - meson-python                        # [build_platform != target_platform]
    - ninja                               # [build_platform != target_platform]
    - pybind11                            # [build_platform != target_platform]

  host:
    - python
    - pybind11
    - pip
    - meson
    - meson-python
    - ninja
  run:
    - python

test:
  imports:
    - kvh
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://forgemia.inra.fr/mathscell/kvh
  summary: KVH format reader/writer
  dev_url: https://forgemia.inra.fr/mathscell/kvh
  license: GPL-2.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sgsokol
